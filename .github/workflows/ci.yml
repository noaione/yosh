name: ci

# Tests + lints on every push/PR to main — the release workflow (release.yml)
# only *builds*, so without this a breaking engine change ships silently.
# Default features only (pure-Rust, no C toolchain — no dav1d/nasm here);
# the AVIF feature is exercised by the release build.
on:
  push:
    branches: [main, naoX]
  pull_request:
    branches: [main, naoX]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0

      # winit/rfd need the desktop dev libs at build time (same set release.yml uses).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy

      - name: Setup rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1
        with:
          prefix-key: "ci-test"

      # Embed the ML models when the weights zip is available, so the model
      # tests run here instead of skipping. Forks have no secret, so the step
      # warns and continues and those tests skip.
      - name: Fetch model weights
        env:
          MANGACOLOR_WEIGHTS_URL: ${{ secrets.MANGACOLOR_WEIGHTS_URL || secrets.OGSOV_WEIGHTS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$MANGACOLOR_WEIGHTS_URL" ]; then
            echo "::warning::no weights URL is set; building without the embedded ML models"
            exit 0
          fi
          archive="$RUNNER_TEMP/mangacolor-weights.zip"
          curl --fail --location --silent --show-error "$MANGACOLOR_WEIGHTS_URL" --output "$archive"
          python3 - "$archive" <<'PY'
          import pathlib, sys, zipfile

          wanted = {
              "ogsov.npz": "ogsov_weights.npz",
              "ogsox_classifier_optimized.onnx": "ogsox_classifier_optimized.onnx",
              "ogsox_lookup_table.npz": "ogsox_lookup_table.npz",
          }
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path("crates/mangacolor")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              entries = {pathlib.Path(name).name: name for name in bundle.namelist()}
              for source, renamed in wanted.items():
                  if source not in entries:
                      sys.exit(f"{source} is not in the weights archive")
                  (target / renamed).write_bytes(bundle.read(entries[source]))
                  print(f"wrote {target / renamed}")
          PY

      # Workspace is clippy-clean; keep it that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
