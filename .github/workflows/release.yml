name: build-artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - naoX
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1

      - name: Cache vcpkg dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          pkg-config --version

      # wpd's build script assembles its x86-64 SIMD kernels with nasm (enabled by
      # the `wpd-simd` feature in the Build step below); the runner image does not
      # ship it. The package's installer only edits the machine registry PATH,
      # which the runner's cached environment never reloads — so resolve nasm.exe
      # here and hand nasm-rs its exact path via `NASM` (which nasm-rs reads
      # first), as well as putting it on PATH.
      - name: Install nasm
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $nasm = (Get-Command nasm.exe -ErrorAction SilentlyContinue).Source
          if (-not $nasm) {
            $found = Get-ChildItem -Path "$env:ProgramFiles\NASM", "${env:ProgramFiles(x86)}\NASM" -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue
            $nasm = ($found | Select-Object -First 1).FullName
          }
          if (-not $nasm) { throw "nasm.exe not found after 'choco install nasm'" }
          "NASM=$nasm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          (Split-Path -Parent $nasm) | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $nasm -v

      # nasm-rs doesn't stop at nasm: after assembling the .o files it packages
      # them into a static library by spawning the MSVC archiver under its *bare*
      # name, `lib`. The runner keeps the MSVC toolchain off PATH (rustc finds
      # link.exe itself via vswhere), so that spawn is what actually fails with
      # "nasm failed: failed to spawn process: program not found" — even though
      # nasm was found and ran fine. Put the x64 MSVC bin dir (lib.exe plus the
      # DLLs it loads, which live alongside it) on PATH for the build.
      - name: Put MSVC toolchain on PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio with the C++ toolset" }
          $msvcBin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } |
            Where-Object { Test-Path (Join-Path $_ 'lib.exe') } |
            Select-Object -First 1
          if (-not $msvcBin) { throw "lib.exe not found under $vsPath\VC\Tools\MSVC" }
          $msvcBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "MSVC x64 bin on PATH: $msvcBin"

      - name: Install dav1d with vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_ROOT\vcpkg.exe" install dav1d:x64-windows-static-release
          $pkgConfigPath = "$env:VCPKG_ROOT\installed\x64-windows-static-release\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = $pkgConfigPath
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-release" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-release" >> $env:GITHUB_ENV
          "SYSTEM_DEPS_DAV1D_LINK=static" >> $env:GITHUB_ENV
          pkg-config --modversion dav1d

      - name: Fetch OGSOV weights
        shell: pwsh
        env:
          OGSOV_WEIGHTS_URL: ${{ secrets.OGSOV_WEIGHTS_URL }}
        run: |
          if ($env:OGSOV_WEIGHTS_URL) {
            Invoke-WebRequest -Uri $env:OGSOV_WEIGHTS_URL -OutFile crates/ogsov/ogsov_weights.npz
          }

      - name: Build
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          Write-Host "nasm: $env:NASM"
          cargo build --release -p yosh --features avif,wpd-simd
          cargo build --release -p yosh-thumbnail --features avif,wpd-simd

      - name: Package executable and portable zip
        shell: pwsh
        run: |
          Copy-Item target/release/yosh.exe yosh-windows-x64.exe
          New-Item -ItemType Directory -Force portable/yosh | Out-Null
          Copy-Item target/release/yosh.exe portable/yosh/yosh.exe
          Copy-Item target/release/yosh_thumbnail.dll portable/yosh/yosh_thumbnail.dll
          Copy-Item crates/yosh/installer/yosh-portable.txt portable/yosh/yosh-portable.txt
          Compress-Archive -Path portable/yosh -DestinationPath yosh-windows-x64-portable.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $versionLine = Select-String -Path crates/yosh/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($version -match '^(\d+)\.(\d+)\.(\d+)-nao\.(\d+)$') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$($Matches[4])"
          } elseif ($version -match '^(\d+)\.(\d+)\.(\d+)$') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            throw "Unsupported Cargo version format: $version"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DAppNumericVersion=$numericVersion" crates/yosh/installer/yosh.iss
          Copy-Item crates/yosh/installer/Output/yosh-setup-x64.exe yosh-setup-x64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yosh-windows-x64
          path: |
            yosh-windows-x64.exe
            yosh-windows-x64-portable.zip
            yosh-setup-x64.exe

  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config meson ninja-build nasm

      - name: Build static dav1d
        run: |
          git clone --branch 1.5.0 --depth 1 https://code.videolan.org/videolan/dav1d.git
          meson setup dav1d/build dav1d --prefix="$HOME/dav1d_install" -Ddefault_library=static -Denable_tools=false -Denable_examples=false --buildtype=release
          ninja -C dav1d/build install
          echo "PKG_CONFIG_PATH=$HOME/dav1d_install/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_DAV1D_LINK=static" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1

      - name: Fetch OGSOV weights
        env:
          OGSOV_WEIGHTS_URL: ${{ secrets.OGSOV_WEIGHTS_URL }}
        run: |
          if [ -n "$OGSOV_WEIGHTS_URL" ]; then
            curl -fSL "$OGSOV_WEIGHTS_URL" -o crates/ogsov/ogsov_weights.npz
          fi

      - name: Build
        run: cargo build --release -p yosh --features avif,wpd-simd

      - name: Package
        run: cp target/release/yosh yosh-linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yosh-linux-x64
          path: yosh-linux-x64

  macos-arm64:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0

      - name: Install build dependencies
        run: brew install dav1d pkg-config

      - name: Configure dav1d
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix dav1d)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_DAV1D_LINK=static" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1

      - name: Fetch OGSOV weights
        env:
          OGSOV_WEIGHTS_URL: ${{ secrets.OGSOV_WEIGHTS_URL }}
        run: |
          if [ -n "$OGSOV_WEIGHTS_URL" ]; then
            curl -fSL "$OGSOV_WEIGHTS_URL" -o crates/ogsov/ogsov_weights.npz
          fi

      - name: Build
        run: cargo build --release -p yosh --features avif,wpd-simd --target aarch64-apple-darwin

      - name: Package
        run: cp target/aarch64-apple-darwin/release/yosh yosh-macos-arm64

      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yosh-macos-arm64
          path: yosh-macos-arm64
