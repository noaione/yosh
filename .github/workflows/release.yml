name: build-release

on:
  push:
    tags: ['v*']        # tag a version -> build + publish a Release
  workflow_dispatch: {}  # manual run -> build artifacts only (no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/yosh.exe
            asset: yosh-windows-x64.exe
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            bin: target/release/yosh
            asset: yosh-linux-x64
            rustflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The app's reported version comes from Cargo.toml (CARGO_PKG_VERSION); the
      # release name/installer come from the tag. They must agree — guard against
      # tagging without bumping (which ships a binary that misreports its version
      # and re-offers the same self-update forever).
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' crates/yosh/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$cargo_ver  tag=$tag_ver"
          [ "$cargo_ver" = "$tag_ver" ] || { echo "::error::tag v$tag_ver does not match Cargo.toml version $cargo_ver — bump crates/yosh/Cargo.toml"; exit 1; }

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --- AVIF needs dav1d (C). Build it from source + statically link so the
      # shipped binaries are self-contained; local/default builds stay C-free and
      # only CI passes --features avif,wpd-simd. Built fresh each release (~2 min; not
      # cached — GitHub caches are ref-scoped, so a tag run can't reuse them).
      # Recipe mirrors dav1d-rs's own CI, plus static + (Windows) /MT to match
      # the +crt-static Rust build. ---
      # MSVC env + nasm are plain shell steps: the ilammy actions that used to do
      # this only ship node20 builds, which GitHub has deprecated.
      - name: Set up MSVC env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Run vcvars64 and hand what it changed (INCLUDE, LIB, the tool PATH
          # entries, …) to the later steps, so meson finds cl.exe / link.exe for
          # dav1d. Only changed variables are exported; new PATH entries go via
          # GITHUB_PATH (which prepends) in reverse, so MSVC's own order survives
          # and its link.exe stays ahead of Git Bash's /usr/bin/link.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools found" }
          $oldPath = $env:Path -split ';'
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -notmatch '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { return }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -eq 'Path') {
              $new = @($value -split ';' | Where-Object { $_ -and ($oldPath -notcontains $_) })
              [array]::Reverse($new)
              $new | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            } elseif ([Environment]::GetEnvironmentVariable($name) -ne $value) {
              "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $nasm = (Get-Command nasm.exe -ErrorAction SilentlyContinue).Source
          if (-not $nasm) {
            $found = Get-ChildItem -Path "$env:ProgramFiles\NASM", "${env:ProgramFiles(x86)}\NASM" -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue
            $nasm = ($found | Select-Object -First 1).FullName
          }
          if (-not $nasm) { throw "nasm.exe not found after 'choco install nasm'" }
          "NASM=$nasm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          (Split-Path -Parent $nasm) | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $nasm -v
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm

      - name: Put MSVC toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio with the C++ toolset" }
          $msvcBin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } |
            Where-Object { Test-Path (Join-Path $_ 'lib.exe') } |
            Select-Object -First 1
          if (-not $msvcBin) { throw "lib.exe not found under $vsPath\VC\Tools\MSVC" }
          $msvcBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "MSVC x64 bin on PATH: $msvcBin"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install meson + ninja
        run: pip install -U meson ninja

      - name: dav1d env (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "PKG_CONFIG_PATH=$HOME/dav1d_install/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_DAV1D_LINK=static" >> "$GITHUB_ENV"
      - name: dav1d env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'PKG_CONFIG=C:\build\bin\pkg-config.exe' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG_PATH=C:\build\lib\pkgconfig' >> "$GITHUB_ENV"
          echo 'C:\build\bin' >> "$GITHUB_PATH"
          echo 'SYSTEM_DEPS_DAV1D_LINK=static' >> "$GITHUB_ENV"

      - name: Build dav1d static (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch 1.5.0 --depth 1 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --prefix="$HOME/dav1d_install" -Ddefault_library=static -Denable_tools=false -Denable_examples=false --buildtype=release
          ninja -C build install
      - name: Build pkg-config + dav1d static (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --branch meson-glib-subproject --depth 1 https://gitlab.freedesktop.org/tpm/pkg-config.git
          cd pkg-config
          meson setup build --prefix=C:\build --buildtype=release
          ninja -C build install
          cd ..
          git clone --branch 1.5.0 --depth 1 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --prefix=C:\build -Ddefault_library=static -Denable_tools=false -Denable_examples=false -Db_vscrt=mt --buildtype=release
          ninja -C build install

      - name: Fetch model weights
        shell: pwsh
        env:
          # One zip of `ogsov.npz`, `ogsox_classifier_optimized.onnx` and
          # `ogsox_lookup_table.npz` -- the same archive the vs-mangacolor CI
          # publishes. `OGSOV_WEIGHTS_URL` is accepted as a fallback so an
          # existing secret keeps working; its value must be the zip too.
          MANGACOLOR_WEIGHTS_URL: ${{ secrets.MANGACOLOR_WEIGHTS_URL }}
        run: |
          if (-not $env:MANGACOLOR_WEIGHTS_URL) {
            Write-Host "::warning::no weights URL is set; building without the embedded ML models"
            exit 0
          }
          $archive = Join-Path $env:RUNNER_TEMP "mangacolor-weights.zip"
          Invoke-WebRequest -Uri $env:MANGACOLOR_WEIGHTS_URL -OutFile $archive
          $expanded = Join-Path $env:RUNNER_TEMP "mangacolor-weights"
          if (Test-Path $expanded) { Remove-Item -Recurse -Force $expanded }
          Expand-Archive -Path $archive -DestinationPath $expanded
          $target = "crates/mangacolor"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          # The archive may nest the files; collect them by basename and store
          # `ogsov.npz` under the name the build script looks for.
          $wanted = [ordered]@{
            "ogsov.npz" = "ogsov_weights.npz"
            "ogsox_classifier_optimized.onnx" = "ogsox_classifier_optimized.onnx"
            "ogsox_lookup_table.npz" = "ogsox_lookup_table.npz"
          }
          foreach ($source in $wanted.Keys) {
            $file = Get-ChildItem -Path $expanded -Recurse -File -Filter $source | Select-Object -First 1
            if (-not $file) { throw "$source is not in the weights archive" }
            Copy-Item -Path $file.FullName -Destination (Join-Path $target $wanted[$source]) -Force
            Write-Host "wrote $target/$($wanted[$source])"
          }

      - name: Build
        run: cargo build --release -p yosh --features avif,wpd-simd
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build Windows thumbnail provider
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p yosh-thumbnail --features avif,wpd-simd

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Build portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/yosh | Out-Null
          Copy-Item target/release/yosh.exe portable/yosh/yosh.exe
          Copy-Item target/release/yosh_thumbnail.dll portable/yosh/yosh_thumbnail.dll
          Copy-Item crates/yosh/installer/yosh-portable.txt portable/yosh/yosh-portable.txt
          Compress-Archive -Path portable/yosh -DestinationPath yosh-windows-x64-portable.zip -Force

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { '0.0.0' }
          Write-Host "Installer version: $ver"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" crates/yosh/installer/yosh.iss
          Copy-Item crates/yosh/installer/Output/yosh-setup-x64.exe yosh-setup-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}

      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: yosh-windows-installers
          path: |
            yosh-windows-x64-portable.zip
            yosh-setup-x64.exe

      - name: Attach Windows installers to release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            yosh-windows-x64-portable.zip
            yosh-setup-x64.exe

  # Android APK. Built on Linux on purpose: UnRAR's C++ only cross-compiles to
  # Android from a Linux host (a Windows host drags in Windows-only sources), so
  # this is where RAR/CBR support gets baked into the APK — local Windows builds
  # keep it off. Gradle-free: build-apk.sh drives cargo-ndk + aapt2/zipalign/
  # apksigner. Independent of the desktop matrix above.
  android:
    runs-on: ubuntu-latest
    env:
      # Mapped from repo secrets so steps can both use them and test their presence
      # via the `env` context (secrets can't be referenced directly in `if:`).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5

      # A release tag must be release-signed — never publish a debug-signed APK.
      # Fail fast on a tag if the keystore secret is missing. (A manual
      # workflow_dispatch without the secret still builds a debug-signed artifact,
      # which is handy for validating the pipeline before the keystore is set up.)
      - name: Require signing key on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot release-sign the APK"
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # versionName from the tag (e.g. v0.1.41 -> 0.1.41); versionCode packed as
      # major*10000 + minor*100 + patch (monotonic; assumes minor/patch < 100). The
      # manifest carries no version, so this is what makes released APKs
      # update-installable (Android rejects a non-increasing versionCode).
      - name: Compute version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then vn="${GITHUB_REF_NAME#v}"; else vn="0.0.0"; fi
          base="${vn%%-*}"
          IFS=. read -r maj min pat <<< "$base"
          maj=${maj:-0}; min=${min:-0}; pat=${pat:-0}
          vc=$(( maj*10000 + min*100 + pat )); [ "$vc" -ge 1 ] || vc=1
          echo "VERSION_NAME=$vn" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$vc"  >> "$GITHUB_ENV"
          echo "APK version $vn (code $vc)"

      - name: Fetch model weights
        env:
          # One zip of `ogsov.npz`, `ogsox_classifier_optimized.onnx` and
          # `ogsox_lookup_table.npz` -- the same archive the vs-mangacolor CI
          # publishes. `OGSOV_WEIGHTS_URL` is accepted as a fallback so an
          # existing secret keeps working; its value must be the zip too.
          MANGACOLOR_WEIGHTS_URL: ${{ secrets.MANGACOLOR_WEIGHTS_URL || secrets.OGSOV_WEIGHTS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$MANGACOLOR_WEIGHTS_URL" ]; then
            echo "::warning::no weights URL is set; building without the embedded ML models"
            exit 0
          fi
          archive="$RUNNER_TEMP/mangacolor-weights.zip"
          curl --fail --location --silent --show-error "$MANGACOLOR_WEIGHTS_URL" --output "$archive"
          python3 - "$archive" <<'PY'
          import pathlib, sys, zipfile

          # The archive may nest the three files; collect them by basename and
          # store `ogsov.npz` under the name the build script looks for.
          wanted = {
              "ogsov.npz": "ogsov_weights.npz",
              "ogsox_classifier_optimized.onnx": "ogsox_classifier_optimized.onnx",
              "ogsox_lookup_table.npz": "ogsox_lookup_table.npz",
          }
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path("crates/mangacolor")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              entries = {pathlib.Path(name).name: name for name in bundle.namelist()}
              for source, renamed in wanted.items():
                  if source not in entries:
                      sys.exit(f"{source} is not in the weights archive")
                  (target / renamed).write_bytes(bundle.read(entries[source]))
                  print(f"wrote {target / renamed}")
          PY

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # build-apk.sh reads PROFILE/FEATURES/VERSION_*/KEYSTORE* from env. With no
      # KEYSTORE it debug-signs; with one it uses the release key. RAR is on (the
      # script's default FEATURES=rar + -DUNIX_TIME_NS).
      - name: Build + sign APK
        run: bash crates/yosh-android/build-apk.sh

      - name: Stage APK asset
        run: cp crates/yosh-android/out/yosh.apk yosh-android.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: yosh-android-apk
          path: yosh-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: yosh-android.apk
